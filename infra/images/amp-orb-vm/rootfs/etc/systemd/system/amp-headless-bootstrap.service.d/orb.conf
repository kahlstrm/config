# Amp's own bootstrap unit, once the token from the dispatch program's Secret
# disk is in its env file.
[Unit]
Requires=amp-orb-env.service
After=amp-orb-env.service

# Amp's update step consumes its skip marker, so a restarted bootstrap would
# download the CLI before reconnecting; set the marker before every start
# (amp-orb-cli-update.service updates the CLI in the background), then run
# Amp's own steps unchanged.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/touch /home/user/.amp/skip-next-headless-update
ExecStartPre=/usr/bin/mkdir -p /home/user/.cache/amp/logs
ExecStartPre=/bin/bash -c 'exec /usr/bin/env -i HOME=/home/user PATH=/home/user/.amp/bin:/home/user/.local/bin:/usr/local/bin:/usr/bin:/bin /usr/local/bin/amp-headless-update-binary'
