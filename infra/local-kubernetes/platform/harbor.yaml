apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 24h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 1h
  releaseName: harbor
  chart:
    spec:
      chart: harbor
      version: 1.18.0
      sourceRef:
        kind: HelmRepository
        name: harbor
  values:
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
      ingress:
        className: private
        hosts:
          core: harbor.kube.kalski.xyz
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
    externalURL: https://harbor.kube.kalski.xyz
    existingSecretAdminPassword: harbor-admin-password
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: local-storage
          size: 50Gi
        database:
          storageClass: local-storage
          size: 5Gi
        redis:
          storageClass: local-storage
          size: 1Gi
        trivy:
          storageClass: local-storage
          size: 5Gi
        jobservice:
          jobLog:
            storageClass: local-storage
    database:
      type: internal
    redis:
      type: internal
    trivy:
      enabled: true
