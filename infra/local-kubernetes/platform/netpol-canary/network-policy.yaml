# The canary may only reach the pod network, so reaching the modem means
# NetworkPolicies are not enforced for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-network-only
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
