apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minio
  namespace: minio
spec:
  interval: 24h
  url: https://operator.min.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 1h
  releaseName: minio
  chart:
    spec:
      chart: operator
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: minio
  values:
    operator:
      replicaCount: 1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-tenant
  namespace: minio
spec:
  interval: 1h
  releaseName: minio-tenant
  dependsOn:
    - name: minio
  chart:
    spec:
      chart: tenant
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: minio
  values:
    tenant:
      name: minio
      configSecret:
        name: minio-env-configuration
        existingSecret: true
      pools:
        - name: pool-0
          servers: 1
          volumesPerServer: 1
          size: 50Gi
          storageClassName: local-storage
      requestAutoCert: false
      certificate:
        requestAutoCert: false
      buckets:
        - name: loki
      users:
        - name: minio-loki-user
      exposeServices:
        console: true
        minio: true
    ingress:
      api:
        enabled: false
      console:
        enabled: true
        ingressClassName: private
        host: minio-console.kube.kalski.xyz
        tls:
          - secretName: minio-console-tls
            hosts:
              - minio-console.kube.kalski.xyz
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
