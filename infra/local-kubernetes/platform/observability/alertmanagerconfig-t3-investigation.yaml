apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: t3-investigation
  namespace: monitoring
spec:
  route:
    receiver: t3-investigation
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    # each delivery opens a new T3 thread; capped at Alertmanager's 120h retention
    repeatInterval: 120h
    matchers:
      - name: severity
        matchType: =
        value: critical
  receivers:
    - name: t3-investigation
      webhookConfigs:
        - urlSecret:
            name: alertmanager-t3
            key: url
          sendResolved: false
