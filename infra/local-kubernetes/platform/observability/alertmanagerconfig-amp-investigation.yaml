# Critical alerts go to the Amp alert intake (tools/alert-intake), which opens one investigation
# thread per alert group on the klusse runner. Telegram pages for the same alerts separately.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: amp-investigation
  namespace: monitoring
spec:
  route:
    receiver: amp-investigation
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    # repeats of a group append to its thread; capped at Alertmanager's 120h retention
    repeatInterval: 120h
    matchers:
      - name: severity
        matchType: =
        value: critical
  receivers:
    - name: amp-investigation
      webhookConfigs:
        - urlSecret:
            name: alertmanager-amp
            key: url
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-amp
                key: token
          sendResolved: false
