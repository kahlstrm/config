apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
  namespace: monitoring
spec:
  interval: 1h
  releaseName: observability
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 79.7.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    crds:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: private
        hosts:
          - grafana.kube.kalski.xyz
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.kube.kalski.xyz
      serviceMonitor:
        enabled: true
        labels:
          release: observability
        interval: 30s
        scrapeTimeout: 10s
        path: /metrics
      persistence:
        enabled: true
        storageClassName: local-storage
        size: 10Gi
      initChownData:
        enabled: false
      podSecurityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki-read.loki.svc:3100
          access: proxy
          isDefault: false
    prometheus:
      prometheusSpec:
        retention: 30d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-storage
              resources:
                requests:
                  storage: 40Gi
    alertmanager:
      alertmanagerSpec:
        # load all AlertmanagerConfig objects (no label filtering)
        alertmanagerConfigSelector: {}
        # but only from explicitly allowed namespaces
        alertmanagerConfigNamespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - monitoring
        # avoid auto-injected namespace matchers so cluster-wide alerts can route
        alertmanagerConfigMatcherStrategy:
          type: None
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-storage
              resources:
                requests:
                  storage: 5Gi
    prometheus-node-exporter:
      namespaceOverride: monitoring-privileged
    kubeEtcd:
      enabled: true
      service:
        selector:
          k8s-app: kube-controller-manager # hostNetwork pod gives node IPs without hardcoding
      serviceMonitor:
        scheme: http
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: nodename
            action: replace
        metricRelabelings:
          - action: labeldrop
            regex: pod
