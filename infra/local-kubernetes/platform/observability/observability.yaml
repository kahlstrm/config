apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
  namespace: monitoring
spec:
  interval: 1h
  releaseName: observability
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 79.7.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    crds:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: private
        hosts:
          - grafana.kube.kalski.xyz
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.kube.kalski.xyz
      serviceMonitor:
        enabled: true
        labels:
          release: observability
        interval: 30s
        scrapeTimeout: 10s
        path: /metrics
      persistence:
        enabled: true
        storageClassName: local-storage
        size: 10Gi
      initChownData:
        enabled: false
      podSecurityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.loki.svc:3100
          access: proxy
          isDefault: false
      grafana.ini:
        server:
          root_url: https://grafana.kube.kalski.xyz
        auth.generic_oauth:
          enabled: true
          name: Pocket ID
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://id.kube.kalski.xyz/authorize
          token_url: https://id.kube.kalski.xyz/api/oidc/token
          api_url: https://id.kube.kalski.xyz/api/oidc/userinfo
          # Public client: PKCE instead of a client secret.
          use_pkce: true
          auth_style: InParams
          groups_attribute_path: groups
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
          role_attribute_strict: true
          allow_sign_up: true
    prometheus:
      prometheusSpec:
        retention: 30d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-storage
              resources:
                requests:
                  storage: 40Gi
    alertmanager:
      alertmanagerSpec:
        # load all AlertmanagerConfig objects (no label filtering)
        alertmanagerConfigSelector: {}
        # but only from explicitly allowed namespaces
        alertmanagerConfigNamespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - monitoring
        # avoid auto-injected namespace matchers so cluster-wide alerts can route
        alertmanagerConfigMatcherStrategy:
          type: None
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-storage
              resources:
                requests:
                  storage: 5Gi
    prometheus-node-exporter:
      namespaceOverride: monitoring-privileged
    kubeEtcd:
      enabled: true
      service:
        selector:
          k8s-app: kube-controller-manager # hostNetwork pod gives node IPs without hardcoding
      serviceMonitor:
        scheme: http
        metricRelabelings:
          - action: labeldrop
            regex: pod
