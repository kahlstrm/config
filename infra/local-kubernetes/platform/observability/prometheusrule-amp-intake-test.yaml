# Temporary end-to-end test of the Amp alert intake (tools/alert-intake). The alert fires at once
# and only the amp-investigation-test route accepts it; revert this file after the test.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: amp-intake-test
  namespace: monitoring
  labels:
    release: observability
spec:
  groups:
    - name: amp-intake-test.rules
      rules:
        - alert: AmpIntakeTest
          expr: vector(1)
          labels:
            severity: critical
            namespace: monitoring
            amp_intake_test: "true"
          annotations:
            summary: "Amp alert intake end-to-end test"
            description: |
              Synthetic alert that always fires. It tests the path from Alertmanager through the Amp
              intake webhook to an investigation thread on the klusse runner. Nothing is wrong.
