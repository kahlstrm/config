apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: t3-webhook-test
  namespace: monitoring
  labels:
    release: observability
spec:
  groups:
    - name: t3-webhook-test.rules
      rules:
        # Temporary: replays the 2026-10-24 etcd alert to test the T3 investigation prompt.
        - alert: etcdInsufficientMembers
          expr: vector(1)
          labels:
            severity: critical
            namespace: kube-system
            job: kube-etcd
            endpoint: http-metrics
            service: observability-kube-prometh-kube-etcd
            nodename: c1
          annotations:
            summary: etcd cluster has insufficient number of members.
            description: 'etcd cluster "kube-etcd": insufficient members (0).'
