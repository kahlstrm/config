apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: t3-webhook-test
  namespace: monitoring
  labels:
    release: observability
spec:
  groups:
    - name: t3-webhook-test.rules
      rules:
        - alert: T3WebhookTest
          expr: vector(1)
          labels:
            severity: critical
            namespace: monitoring
          annotations:
            summary: "Test alert for the T3 investigation webhook"
            description: |
              Not a real problem. This always-firing alert comes from the temporary
              PrometheusRule monitoring/t3-webhook-test and is removed after the test.
