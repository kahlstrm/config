apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-t3
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data:
    - secretKey: url
      remoteRef:
        key: local-kubernetes
        property: t3_alert_webhook_url
