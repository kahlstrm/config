apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: loki
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 1h
  releaseName: loki
  dependsOn:
    - name: minio-tenant
      namespace: minio
  chart:
    spec:
      chart: loki
      version: 6.46.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    deploymentMode: SimpleScalable
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # Loki expands these from loki-s3-credentials; keep Flux postBuild substitution off.
      storage:
        type: s3
        s3:
          endpoint: ${AWS_ENDPOINT_URL}
          accessKeyId: ${AWS_ACCESS_KEY_ID}
          secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
          s3ForcePathStyle: true
          insecure: ${AWS_S3_INSECURE}
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
      storage_config:
        tsdb_shipper:
          active_index_directory: /var/loki/tsdb-index
          cache_location: /var/loki/tsdb-cache
    backend:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      persistence:
        storageClass: local-storage
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
    read:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
    write:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      persistence:
        storageClass: local-storage
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
    singleBinary:
      replicas: 0
    minio:
      enabled: false
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
