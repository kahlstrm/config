# Pool base from a private repository; pinned by commit.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: katalyst
  namespace: flux-system
spec:
  url: ssh://git@github.com/KatalystSoftware/katalyst
  ref:
    commit: "d52644f92a1a65edd53a37c90b76f4895e635b3e"
  interval: 10m
  secretRef:
    name: katalyst-deploy-key
  ignore: |
    /*
    !/deploy/pool/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: katalyst-pool-source
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/local-kubernetes/apps/katalyst-pool/source
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: katalyst-pool
  namespace: flux-system
spec:
  dependsOn:
    - name: katalyst-pool-source
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: katalyst
  path: ./deploy/pool
  prune: true
  deletionPolicy: Orphan
  patches:
    - target:
        kind: RuntimeClass
      patch: |
        - op: add
          path: /scheduling
          value:
            nodeSelector:
              orbs.kalski.xyz/pool: dedicated
            tolerations:
              - key: orbs.kalski.xyz/pool
                operator: Equal
                value: dedicated
                effect: NoSchedule
    - target:
        kind: ResourceQuota
        name: ci-runners
        namespace: ci-runners
      patch: |
        - op: replace
          path: /spec/hard/requests.memory
          value: 32Gi
        - op: replace
          path: /spec/hard/limits.memory
          value: 32Gi
    - target:
        kind: HelmRelease
        name: klusse
        namespace: ci-runners
      patch: |
        - op: replace
          path: /spec/values/githubConfigUrl
          value: https://github.com/KatalystSoftware/pool-canary
    - target:
        kind: HelmRelease
        name: klusse-katalyst
        namespace: ci-runners
      patch: |
        - op: replace
          path: /spec/values/githubConfigUrl
          value: https://github.com/KatalystSoftware/katalyst
        - op: replace
          path: /spec/values/maxRunners
          value: 3
        - op: test
          path: /spec/values/template/spec/volumes/3/name
          value: docker-data
        - op: replace
          path: /spec/values/template/spec/volumes/3/ephemeral/volumeClaimTemplate/spec/resources/requests/storage
          value: 30Gi
        - op: replace
          path: /spec/suspend
          value: false
    - target:
        kind: HelmRelease
        name: klusse|klusse-katalyst
        namespace: ci-runners
      patch: |
        - op: replace
          path: /spec/values/githubConfigSecret
          value: pool-github-app
        - op: replace
          path: /spec/values/template/spec/initContainers/0/image
          value: ghcr.io/katalystsoftware/pool-runner@sha256:99d5048b300f0d14f301356cc4a92ddb9cb402b34f02e18d84df1b3563724cff
        - op: replace
          path: /spec/values/template/spec/containers/0/image
          value: ghcr.io/katalystsoftware/pool-runner@sha256:99d5048b300f0d14f301356cc4a92ddb9cb402b34f02e18d84df1b3563724cff
        - op: add
          path: /spec/values/template/spec/nodeSelector
          value:
            orbs.kalski.xyz/pool: dedicated
        - op: add
          path: /spec/values/template/spec/tolerations
          value:
            - key: orbs.kalski.xyz/pool
              operator: Equal
              value: dedicated
              effect: NoSchedule
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: katalyst-pool-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: katalyst-pool
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/local-kubernetes/apps/katalyst-pool/secrets
  prune: true
  wait: true
