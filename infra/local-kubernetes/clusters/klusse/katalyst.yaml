# The self-hosted Katalyst deployment, after the apps layer (rustfs) and outside it: each of
# these stays unready until its secrets and images exist (the GHCR token, the Anthropic key,
# the provider's image and token, and for the providers, which run with `hostUsers: false`, the
# workers' user-namespace sysctl from local-talos/patches/userns-worker.yaml), and nothing waits
# on them, so the other layers stay healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: katalyst
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/local-kubernetes/apps/katalyst
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  wait: true
---
