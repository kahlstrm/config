apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/local-kubernetes/infrastructure/controllers
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/local-kubernetes/infrastructure/configs
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  wait: true
