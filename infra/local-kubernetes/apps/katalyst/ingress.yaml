# The self-hosted deployment's address, on the LAN and WireGuard only. No oauth2-proxy: people,
# T3 clients, the provider and the thread machines authenticate to the control plane themselves,
# and forward-auth would break their bearer tokens. Machines use path routes
# (/_katalyst/machines/<id>/), so there is no wildcard name. The router also joins Traefik's
# katalyst entry point, the only one the machines reach (platform/traefik.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: katalyst
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,katalyst
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: private
  tls:
    - hosts:
        - katalyst.kube.kalski.xyz
      secretName: katalyst-tls
  rules:
    - host: katalyst.kube.kalski.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: celld
                port:
                  name: http
