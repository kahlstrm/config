# The self-hosted deployment of the Katalyst control plane: the Worker bundle that
# KatalystSoftware/katalyst publishes to GHCR, which celld runs on klusse with its data in
# rustfs.
apiVersion: v1
kind: Namespace
metadata:
  name: katalyst
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
