# The same GHCR token as katalyst/bundle.yaml, for the provider's and the machines' private
# images. It lives in Secret Manager (infra/AGENTS.md#secret-management).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: local-kubernetes
        property: katalyst_ghcr_username
    - secretKey: token
      remoteRef:
        key: local-kubernetes
        property: katalyst_ghcr_token
