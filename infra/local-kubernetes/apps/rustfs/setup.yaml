# Sets up the Katalyst buckets and the users scoped to them (setup.sh). Flux
# replaces the Job when its script changes, and recreates it on the first reconcile after the
# TTL, so drift is undone within about two hours.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostAliases:
        - ip: 10.96.0.20
          hostnames: [s3.kube.kalski.xyz]
      # Beside rustfs, so the user's secret key in the request body stays on the node.
      nodeSelector:
        kubernetes.io/hostname: w2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command: [sh, /setup/setup.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: setup
              mountPath: /setup
            - name: admin
              mountPath: /admin
            - name: users
              mountPath: /users
      volumes:
        - name: setup
          configMap:
            name: rustfs-setup
        - name: admin
          secret:
            secretName: rustfs-admin
        - name: users
          projected:
            sources:
              - secret:
                  name: katalyst-poc-key
                  items:
                    - {key: access-key, path: katalyst-poc/access-key}
                    - {key: secret-key, path: katalyst-poc/secret-key}
              - secret:
                  name: katalyst-fleet-node
                  items:
                    - {key: access-key, path: katalyst-fleet-node/access-key}
                    - {key: secret-key, path: katalyst-fleet-node/secret-key}
              - secret:
                  name: katalyst-fleet-deploy
                  items:
                    - {key: access-key, path: katalyst-fleet-deploy/access-key}
                    - {key: secret-key, path: katalyst-fleet-deploy/secret-key}
              - secret:
                  name: katalyst-issuer
                  items:
                    - {key: access-key, path: katalyst-issuer/access-key}
                    - {key: secret-key, path: katalyst-issuer/secret-key}
