# Sets up the proof of concept's bucket and the user that can use only that bucket. Flux
# replaces the Job when its script changes, and recreates it on the first reconcile after the
# TTL, so drift is undone within about two hours.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Beside rustfs, so the user's secret key in the request body stays on the node.
      nodeSelector:
        kubernetes.io/hostname: w2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command: [sh, /setup/setup.sh]
          env:
            - name: BUCKET
              value: katalyst-poc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: setup
              mountPath: /setup
            - name: admin
              mountPath: /admin
            - name: scoped
              mountPath: /scoped
      volumes:
        - name: setup
          configMap:
            name: rustfs-setup
        - name: admin
          secret:
            secretName: rustfs-admin
        - name: scoped
          secret:
            secretName: katalyst-poc-key
