# One rustfs server with one drive: the claim on w2's local-storage disk. Single-node,
# single-disk mode keeps no parity, so losing that disk loses the objects; see the ADR.
# The claim keeps its data on w2 when deleted (local-storage retains it).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  storageClassName: local-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  # One drive, one writer: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      # Beside klusse-w2, its client, so S3 traffic stays on the node.
      nodeSelector:
        kubernetes.io/hostname: w2
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
          command: [/usr/bin/rustfs]
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            # Empty logs to stdout, where Alloy collects them.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: warn
            # TLS on the S3 port, from the cert-manager Secret rustfs-tls; plain HTTP is refused.
            # rustfs rereads the files every 30 s, so a renewed certificate needs no restart.
            - name: RUSTFS_TLS_PATH
              value: /tls
            - name: RUSTFS_TLS_RELOAD_ENABLE
              value: "1"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: tls
          secret:
            secretName: rustfs-tls
            # The file names rustfs looks for in RUSTFS_TLS_PATH.
            items:
              - key: tls.crt
                path: rustfs_cert.pem
              - key: tls.key
                path: rustfs_key.pem
---
# A fixed address, because the compute runners and the self-hosted deployment's thread machines
# resolve names only through public DNS: the endpoint is https://s3.kube.kalski.xyz:9000 with the
# name pinned to 10.96.0.20, from the service range's static band, which automatic allocation
# leaves alone. modules/klusse-runner's guest firewall allows the same address.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  type: ClusterIP
  clusterIP: 10.96.0.20
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Only the S3 port, only for the compute runners, this namespace (the setup Job), the
# self-hosted deployment's celld nodes and deploy Job (katalyst) and its thread machines
# (katalyst-machines).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: compute-runners
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: katalyst
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: katalyst-machines
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9000
