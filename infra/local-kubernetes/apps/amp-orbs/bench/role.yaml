# Agents create, pause and delete test orb VMs with their disks and env Secrets,
# and run plain pods, e.g. a listener standing in for Amp. No exec or attach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-orb-bench
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, secrets, pods]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-orb-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-orb-bench
subjects:
  - kind: ServiceAccount
    name: agent-debug-reader
    namespace: agent-debug
