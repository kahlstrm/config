# Once a day, deletes the disks of orbs paused longer than RECLAIM_DAYS
# (scripts/reclaim.mjs). Runs on the provider's image, which has Node.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amp-orb-reclaim
spec:
  schedule: "17 4 * * *"
  timeZone: Europe/Helsinki
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: amp-orb-reclaim
        spec:
          serviceAccountName: amp-orb-reclaim
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: reclaim
              image: set from provider.yaml
              command: [node, /opt/dispatch/reclaim.mjs]
              env:
                - name: RECLAIM_DAYS
                  value: "14"
                - name: NODE_EXTRA_CA_CERTS
                  value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: dispatch
                  mountPath: /opt/dispatch
          volumes:
            - name: dispatch
              configMap:
                name: amp-orb-dispatch
                defaultMode: 0555
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amp-orb-reclaim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amp-orb-reclaim
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [delete]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [list, delete]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amp-orb-reclaim
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amp-orb-reclaim
subjects:
  - kind: ServiceAccount
    name: amp-orb-reclaim
