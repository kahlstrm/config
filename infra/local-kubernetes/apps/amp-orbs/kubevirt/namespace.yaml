# Amp orbs as KubeVirt VMs, from the operator's personal `klusse-kubevirt` orb
# provider. Each orb runs in a virt-launcher pod, which needs baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: amp-orbs-kubevirt
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
