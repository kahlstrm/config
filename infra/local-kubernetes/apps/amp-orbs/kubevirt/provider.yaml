# Runs `amp orb provider` with the dispatch program. Amp's orb image already
# has the CLI and Node; the provider keeps its CLI up to date on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp-orb-provider
  labels: &labels
    app.kubernetes.io/name: amp-orb-provider
spec:
  replicas: 1
  # Exactly one provider per token, or jobs split between two of them.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: amp-orb-provider
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: provider
          image: us-central1-docker.pkg.dev/amp-prod-0/amp-orb/amp-orb@sha256:2e2bf015cb071c1154004a06ebbdbb23bf966d3b7873133c362b7e1b31da56ae
          command: [bash, -lc, "exec amp orb provider /opt/dispatch/dispatch.mjs"]
          env:
            - name: AMP_ORB_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: amp-orb-provider
                  key: AMP_ORB_PROVIDER_TOKEN
            - name: ORB_VM_IMAGE
              value: set from image-prepull.yaml
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dispatch
              mountPath: /opt/dispatch
      volumes:
        - name: dispatch
          configMap:
            name: amp-orb-dispatch
            defaultMode: 0555
