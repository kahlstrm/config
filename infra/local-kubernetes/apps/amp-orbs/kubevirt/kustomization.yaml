apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amp-orbs-kubevirt
resources:
  - namespace.yaml
  - provider-token.yaml
  - rbac.yaml
  - provider.yaml
  - network-policy.yaml
  - quota.yaml
  - image-prepull.yaml
  - reclaim.yaml
configMapGenerator:
  - name: amp-orb-dispatch
    files:
      - scripts/dispatch.mjs
      - scripts/reclaim.mjs
replacements:
  - source:
      kind: DaemonSet
      name: orb-image-prepull
      fieldPath: spec.template.spec.volumes.[name=orb-image].image.reference
    targets:
      - select:
          kind: Deployment
          name: amp-orb-provider
        fieldPaths:
          - spec.template.spec.containers.[name=provider].env.[name=ORB_VM_IMAGE].value
  - source:
      kind: Deployment
      name: amp-orb-provider
      fieldPath: spec.template.spec.containers.[name=provider].image
    targets:
      - select:
          kind: CronJob
          name: amp-orb-reclaim
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=reclaim].image
