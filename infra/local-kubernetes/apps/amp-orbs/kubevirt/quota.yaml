# Caps orbs at four running VMs (4 vCPU, 8 Gi each, plus virt-launcher overhead)
# beside the provider, two pre-pull pods and the reclaim job. Requests only:
# KubeVirt sizes virt-launcher pods itself.
# Disks are capped at 100 orbs' (30 Gi state, 9 Gi swap), but those sizes are
# limits, not reservations: disk images are sparse on the workers' orb disks, and
# reclaim.yaml deletes the disks of orbs paused too long.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: amp-orbs
spec:
  hard:
    pods: "8"
    requests.cpu: "3"
    requests.memory: 36Gi
    persistentvolumeclaims: "200"
    requests.storage: 3900Gi
