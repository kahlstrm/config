# Caps orbs at four running VMs (4 vCPU, 8 Gi each, plus virt-launcher overhead)
# and twenty orbs' disks (30 Gi state, 9 Gi swap) on the workers' orb disks.
# Requests only: KubeVirt sizes virt-launcher pods itself.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: amp-orbs
spec:
  hard:
    pods: "8"
    requests.cpu: "3"
    requests.memory: 36Gi
    persistentvolumeclaims: "40"
    requests.storage: 800Gi
