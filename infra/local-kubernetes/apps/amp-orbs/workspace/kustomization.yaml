# Amp orbs for the `katalyst` workspace, from its `klusse` orb provider: the
# same KubeVirt orbs as ../kubevirt, with their own namespace, token and quota,
# so members' orbs cannot use up the operator's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amp-orbs-katalyst
resources:
  - ../kubevirt
patches:
  - target:
      kind: ExternalSecret
      name: amp-orb-provider
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/property
        value: amp_orb_provider_katalyst
  # Two running VMs beside the provider, two pre-pull pods and the reclaim job,
  # and 50 orbs' disks.
  - target:
      kind: ResourceQuota
      name: amp-orbs
    patch: |
      - op: replace
        path: /spec/hard
        value:
          pods: "6"
          requests.cpu: 1500m
          requests.memory: 18Gi
          persistentvolumeclaims: "100"
          requests.storage: 1950Gi
  # Members' orbs keep their disks for a week after they pause.
  - target:
      kind: CronJob
      name: amp-orb-reclaim
    patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/0/value
        value: "7"
