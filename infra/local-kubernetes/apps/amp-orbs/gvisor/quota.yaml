# Caps orbs at four running at once and twenty orb homes on the workers' orb disks.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: amp-orbs
spec:
  hard:
    pods: "5"
    requests.cpu: "5"
    requests.memory: 18Gi
    limits.memory: 34Gi
    persistentvolumeclaims: "20"
    requests.storage: 400Gi
---
# Defaults for containers that set no resources, which the quota requires.
apiVersion: v1
kind: LimitRange
metadata:
  name: amp-orbs
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
