# The runner's Amp access key. It acts as the whole Amp account, so it has a Secret Manager
# secret of its own, which only External Secrets reads (infra/gcp-project/cluster-secrets.tf),
# and only External Secrets writes it here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amp-runner
  namespace: amp-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data:
    - secretKey: key
      remoteRef:
        key: klusse_amp_runner_key
