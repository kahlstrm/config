# The runner's Amp access key. It acts as the whole Amp account, so it lives in Secret Manager
# (infra/AGENTS.md#secret-management) and only External Secrets writes it here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amp-runner
  namespace: amp-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data:
    - secretKey: key
      remoteRef:
        key: local-kubernetes
        property: klusse_amp_runner_key
