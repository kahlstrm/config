apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-debug-credentials
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kahlstrm/config.git
    targetRevision: main
    path: infra/local-kubernetes/manifests/agent-debug
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-debug
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: agent-debug-reader-token
      namespace: agent-debug
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
