# The klusse-vm scale set's GitHub App credentials, which ARC reads in its own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pool-github-app
  namespace: ci-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data:
    - secretKey: github_app_id
      remoteRef:
        key: local-kubernetes
        property: klusse_ci_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: local-kubernetes
        property: klusse_ci_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: local-kubernetes
        property: klusse_ci_private_key
