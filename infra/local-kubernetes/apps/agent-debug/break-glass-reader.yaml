# Read-only cluster access from outside the cluster, for when the in-cluster klusse runner is down
# (infra/docs/adr/2026-11-09-one-runner-per-managed-thing.md). Bound only to the reader role:
# no pod deletion, evictions, sandbox pods or monitoring proxy. The token is enrolled on the
# runner host by hand; see local.ampRunner.kubernetesTokenFile in machines/pannu.nix.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass-reader
  namespace: agent-debug
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: break-glass-reader-token
  namespace: agent-debug
  annotations:
    kubernetes.io/service-account.name: break-glass-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: break-glass-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-debug-reader
subjects:
  - kind: ServiceAccount
    name: break-glass-reader
    namespace: agent-debug
