# Test pods may only use these images. Nodes pull images outside any NetworkPolicy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-sandbox-images
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agent-sandbox
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allowed
      expression: >-
        ['busybox:', 'docker.io/library/busybox:',
        'registry.k8s.io/e2e-test-images/agnhost:', 'harbor.kube.kalski.xyz/']
  validations:
    - expression: >-
        (object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []))
        .all(c, variables.allowed.exists(p, c.image.startsWith(p)))
      message: agent-sandbox pods may only use busybox, agnhost or Harbor images.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-sandbox-images
spec:
  policyName: agent-sandbox-images
  validationActions: [Deny]
