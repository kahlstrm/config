# The account's one Amp access key, which the klusse runner uses too. The VMs read it from a
# Secret disk; with root in the VM, their threads can read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amp-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data:
    - secretKey: key
      remoteRef:
        key: local-kubernetes
        property: klusse_amp_runner_key
