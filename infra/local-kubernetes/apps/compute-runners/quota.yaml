# Caps the namespace at the klusse-w1 and klusse-w2 VMs: for each, its 12 GiB guest and 1 CPU
# request plus virt-launcher's overhead, and its claim. Requests only: KubeVirt sizes
# virt-launcher pods itself.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-runners
spec:
  hard:
    pods: "4"
    requests.cpu: "4"
    requests.memory: 28Gi
    persistentvolumeclaims: "2"
    requests.storage: 200Gi
