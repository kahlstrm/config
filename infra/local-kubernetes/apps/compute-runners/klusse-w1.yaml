# The compute runner klusse-w1 on worker w1, which works like an orb: its threads have root in
# the VM, so the namespace's NetworkPolicy is its boundary. The guest is machines/klusse-w1.nix;
# .github/workflows/klusse-runner-vm.yml builds its containerDisk, which boots the kernel and
# init named here and holds the store. The claim holds /nix, /home, /var and /tmp, and keeps
# its data on w1 when deleted (local-storage retains it).
#
# It also runs the self-hosted orbs of the provider klusse-w1 as Docker containers
# (infra/docs/adr/2026-11-19-docker-orbs-in-runner-vms.md). Docker keeps them on the claim
# klusse-w1-orbs, the disk `orbs`, whose size caps what orbs use on w1's disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klusse-w1
spec:
  storageClassName: local-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klusse-w1-orbs
spec:
  storageClassName: local-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: klusse-w1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compute-runner
        app.kubernetes.io/instance: klusse-w1
    spec:
      # Without it KubeVirt picks the cluster default, arm64 like the control planes.
      architecture: amd64
      nodeSelector:
        kubernetes.io/hostname: w1
      domain:
        cpu:
          cores: 12
          # Nested KVM, for NixOS VM tests.
          model: host-passthrough
        memory:
          # What w1 can spare beside the cluster's own workloads.
          guest: 20Gi
        resources:
          requests:
            cpu: "1"
            memory: 20Gi
          limits:
            cpu: "12"
            memory: 20Gi
        firmware:
          kernelBoot:
            kernelArgs: console=ttyS0 init=/nix/.ro-store/.system/init
            container:
              # klusse-w1-vm-2f63ca413833
              image: ghcr.io/kahlstrm/amp-runner@sha256:a6e465edb1483b0e4cc1dafcdbeee2a652de47a89866bd09dedcd3a4cb64e698
              kernelPath: /boot/vmlinuz
              initrdPath: /boot/initrd
        devices:
          disks:
            - name: store
              disk:
                bus: virtio
            - name: persistent
              serial: persistent
              disk:
                bus: virtio
            - name: amp-runner-token
              serial: amp-runner-token
              disk:
                bus: virtio
            - name: orbs
              serial: orbs
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          rng: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: store
          containerDisk:
            image: ghcr.io/kahlstrm/amp-runner@sha256:a6e465edb1483b0e4cc1dafcdbeee2a652de47a89866bd09dedcd3a4cb64e698
            path: /disk/store.erofs
        - name: persistent
          persistentVolumeClaim:
            claimName: klusse-w1
        - name: amp-runner-token
          secret:
            secretName: amp-runner
        - name: orbs
          persistentVolumeClaim:
            claimName: klusse-w1-orbs
