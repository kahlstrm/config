# The compute runner klusse-w1 on worker w1, which works like an orb: its threads have root in
# the VM, so the namespace's NetworkPolicy is its boundary. The guest is machines/klusse-w1.nix;
# .github/workflows/klusse-runner-vm.yml builds its containerDisk, which boots the kernel and
# init named here and holds the store. The claim holds /nix, /home, /var and /tmp, and keeps
# its data on w1 when deleted (local-storage retains it).
#
# It also runs the self-hosted orbs of the provider klusse-w1 as Docker containers
# (infra/docs/adr/2026-11-19-docker-orbs-in-runner-vms.md). Docker keeps them on the claim
# klusse-w1-orbs, the disk `orbs`. KubeVirt backs it with the file disk.img in the claim's
# directory on w1, and that file's size, not the claim's, caps what orbs use on w1's disk.
#
# disk.img is 600 GiB, grown in place from 200 GiB to 400 GiB and then to 600 GiB, each time
# while the VM ran. The claim still requests 200Gi:
# - Nothing resizes it. The local-storage class allows expansion, but OpenEBS LocalPV
#   hostpath has no resizer, so a larger request only stays pending with the claim at 200Gi.
# - The namespace's quota (quota.yaml) is full at 400Gi, which counts the claims' requests,
#   not disk.img. Flux dry-runs every object under apps before it applies any, so raising the
#   quota and this request in one change fails each reconcile of apps.
# - KubeVirt keeps an existing disk.img when the VM restarts. Its disk expansion, always on
#   since KubeVirt v1.9, grows disk.img only to the claim's reported capacity, which stays
#   200Gi here, and never shrinks a larger disk.img.
# Count disk.img's size, not this request, when planning w1's local-storage disk.
#
# To grow disk.img again, a maintainer with cluster-admin runs the steps below. Never shrink
# it: XFS cannot shrink, so a smaller disk.img loses orbs' data.
#   L=$(kubectl -n compute-runners get pod -l kubevirt.io/domain=klusse-w1 -o name)
#   V='virsh -c qemu+unix:///session?socket=/var/run/libvirt/virtqemud-sock'
#   D=compute-runners_klusse-w1
# 1. Check free space on w1, and leave room for the other claims there:
#    kubectl debug node/w1 -n kube-system --profile=sysadmin -it --image=busybox -- \
#      df -h /host/var/mnt/local-storage
# 2. Check that vdd is the orbs disk.img and has the size recorded above. Stop if either differs:
#    kubectl -n compute-runners exec $L -c compute -- $V domblklist $D
#    kubectl -n compute-runners exec $L -c compute -- $V domblkinfo $D vdd
# 3. Optionally grow the file first, from a one-shot privileged pod on w1 that mounts only the
#    claim's directory, checking that disk.img still has the size recorded above:
#      truncate -s <bytes> disk.img
#    blockresize also grows the file, so this is optional; step 4 still tells the guest.
# 4. Grow it while the VM runs, then check domblkinfo again: <bytes> is the new size in bytes,
#    larger than the current capacity.
#    kubectl -n compute-runners exec $L -c compute -- $V blockresize $D vdd <bytes>B
# 5. In the guest, grow the filesystem and check that df shows the new size:
#    sudo xfs_growfs /var/lib/docker && df -h /var/lib/docker
# Then record the new size above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klusse-w1
spec:
  storageClassName: local-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klusse-w1-orbs
spec:
  storageClassName: local-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: klusse-w1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compute-runner
        app.kubernetes.io/instance: klusse-w1
    spec:
      # Without it KubeVirt picks the cluster default, arm64 like the control planes.
      architecture: amd64
      nodeSelector:
        kubernetes.io/hostname: w1
      domain:
        cpu:
          cores: 12
          # Nested KVM, for NixOS VM tests.
          model: host-passthrough
        memory:
          # What w1 can spare beside the cluster's own workloads.
          guest: 20Gi
        resources:
          requests:
            cpu: "1"
            memory: 20Gi
          limits:
            cpu: "12"
            memory: 20Gi
        firmware:
          kernelBoot:
            kernelArgs: console=ttyS0 init=/nix/.ro-store/.system/init
            container:
              # klusse-w1-vm-ee50ea7d85dc
              image: ghcr.io/kahlstrm/amp-runner@sha256:0bc29af408372e7332094c72b994a16ef4933d48bb1fe5d36ddb95736c793887
              kernelPath: /boot/vmlinuz
              initrdPath: /boot/initrd
        devices:
          disks:
            - name: store
              disk:
                bus: virtio
            - name: persistent
              serial: persistent
              disk:
                bus: virtio
            - name: amp-runner-token
              serial: amp-runner-token
              disk:
                bus: virtio
            - name: orbs
              serial: orbs
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          rng: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: store
          containerDisk:
            image: ghcr.io/kahlstrm/amp-runner@sha256:0bc29af408372e7332094c72b994a16ef4933d48bb1fe5d36ddb95736c793887
            path: /disk/store.erofs
        - name: persistent
          persistentVolumeClaim:
            claimName: klusse-w1
        - name: amp-runner-token
          secret:
            secretName: amp-runner
        - name: orbs
          persistentVolumeClaim:
            claimName: klusse-w1-orbs
