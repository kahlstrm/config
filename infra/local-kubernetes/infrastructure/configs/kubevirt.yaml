# The KubeVirt deployment the operator reconciles. VMs use KVM on the amd64 workers,
# and so do KubeVirt's own components: on the Pi control planes their traffic made
# the Ethernet driver stall often enough to cost etcd its leader.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
  imagePullPolicy: IfNotPresent
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  workloadUpdateStrategy: {}
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
