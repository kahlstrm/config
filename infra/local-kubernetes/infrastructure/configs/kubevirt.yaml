# The KubeVirt deployment the operator reconciles. VMs use KVM on the amd64 workers,
# and so do KubeVirt's own components: on the Pi control planes their traffic made
# the Ethernet driver stall often enough to cost etcd its leader.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    # The default CPU limits (15m and 10m) throttle these containers' runc init
    # so much that each takes 10-20 s to start, before a VM can boot. Their
    # requests stay small; only the limits rise.
    supportContainerResources:
      - type: guest-console-log
        resources:
          limits:
            cpu: "1"
      - type: container-disk
        resources:
          limits:
            cpu: "1"
  imagePullPolicy: IfNotPresent
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  workloadUpdateStrategy: {}
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
