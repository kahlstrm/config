# Flux decrypts the SOPS-encrypted Secrets in platform and apps with this key. It has a Secret
# Manager secret of its own, which only External Secrets reads (infra/gcp-project/cluster-secrets.tf).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sops-age
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  data:
    - secretKey: age.agekey
      remoteRef:
        key: sops_age_key
