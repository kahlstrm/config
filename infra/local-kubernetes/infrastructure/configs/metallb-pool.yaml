apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: private-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.80-10.10.10.99
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: private
  namespace: metallb-system
spec:
  ipAddressPools:
    - private-pool
