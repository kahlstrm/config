apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  # Only namespaces that need internet-usable credentials may read the store.
  conditions:
    - namespaces:
        - amp-orbs-kubevirt
        - cert-manager
        - flux-system
        - monitoring
  provider:
    gcpsm:
      projectID: infra-464520
      auth:
        workloadIdentityFederation:
          # local-talos output external_secrets_audience
          audience: //iam.googleapis.com/projects/638826885263/locations/global/workloadIdentityPools/klusse/providers/kubernetes
          serviceAccountRef:
            name: gcp-secret-manager
            namespace: external-secrets
            audiences:
              - //iam.googleapis.com/projects/638826885263/locations/global/workloadIdentityPools/klusse/providers/kubernetes
