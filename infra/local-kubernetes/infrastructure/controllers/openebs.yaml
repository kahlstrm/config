apiVersion: v1
kind: Namespace
metadata:
  name: openebs
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 24h
  url: https://openebs.github.io/openebs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 1h
  releaseName: openebs
  chart:
    spec:
      chart: openebs
      version: 4.3.3
      sourceRef:
        kind: HelmRepository
        name: openebs
  values:
    engines:
      replicated:
        # Mayastor needs three or more workers.
        mayastor:
          enabled: false
          csi:
            node:
              initContainers:
                enabled: false # Talos has nvme_tcp built-in
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
    # OpenEBS' bundled log stack (Loki, its MinIO and Alloy) only collects OpenEBS'
    # own logs; the platform Loki and Alloy already cover them.
    loki:
      enabled: false
    alloy:
      enabled: false
