apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.13.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
---
# GCP trusts this account's tokens for the cluster's secrets only: local-kubernetes,
# sops_age_key and klusse_amp_runner_key. See local-talos/external-secrets.tf and
# gcp-project/cluster-secrets.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcp-secret-manager
  namespace: external-secrets
