# Switches a running node from Talos's Flannel and kube-proxy to no CNI, as
# setting cni = "cilium" in Terraform does (with the Cilium inline manifest).
# The flannel block must go: Talos rejects
# kubeNetworkPoliciesEnabled without Flannel.
cluster:
  network:
    cni:
      name: none
      flannel:
        $patch: delete
  proxy:
    disabled: true
