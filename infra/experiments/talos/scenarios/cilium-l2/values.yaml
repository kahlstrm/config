# Added to ../cilium/values.yaml: Cilium answers ARP for LoadBalancer
# addresses itself, replacing MetalLB's L2 mode. The client rate limit is
# raised as Cilium's L2 announcement docs advise, since every announced
# Service holds a Lease.
l2announcements:
  enabled: true
externalIPs:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 40
