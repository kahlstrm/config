# The runtime classes for local-talos/patches/orb-gvisor-worker.yaml's handlers, and
# a privileged namespace for the gvisor scenario's pods, which add capabilities.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-docker
handler: runsc-docker
---
apiVersion: v1
kind: Namespace
metadata:
  name: gvisor
  labels:
    pod-security.kubernetes.io/enforce: privileged
