# Workloads that the CNI migration scenarios watch. ${PROBE_IMAGE} is the netpol
# canary's image; ${SINK} is the host's address and port that probers report to.
apiVersion: v1
kind: Namespace
metadata:
  name: mig-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# A LoadBalancer Service like production's Traefik: an address from the pool,
# not pinned. One backend on each worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mig-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: web}
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: httpd
          image: ${PROBE_IMAGE}
          command: [sh, -c, 'mkdir -p /tmp/www && echo ok > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www']
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mig-app
  annotations:
    metallb.universe.tf/address-pool: private-pool
spec:
  type: LoadBalancer
  # Fixed, so probers reach it without DNS.
  clusterIP: 10.96.100.10
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-pods
  namespace: mig-app
spec:
  clusterIP: None
  selector: {app: web}
  ports:
    - port: 8080
---
# Known data on a production local-storage volume (OpenEBS hostpath on the
# local-storage user volume).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: mig-app
spec:
  storageClassName: local-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
  namespace: mig-app
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: data}
  template:
    metadata:
      labels: {app: data}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: data
          image: ${PROBE_IMAGE}
          command: [sh, -c, 'exec sleep 2147483647']
          volumeMounts:
            - {name: data, mountPath: /data}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: mig-control
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Production's pod-network-only policy, rewritten to namespaceSelector: {} as
# Cilium requires, is applied to mig-policed by the test. This one adds the
# host's report sink.
apiVersion: v1
kind: Namespace
metadata:
  name: mig-policed
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: report-sink
  namespace: mig-policed
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: ${SINK_IP}/32
      ports:
        - {protocol: TCP, port: ${SINK_PORT}}
