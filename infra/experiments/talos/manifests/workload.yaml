# Probe targets and namespaces. ${PROBE_IMAGE} is the netpol canary's image.
# The echo server runs on the control plane, so probes on the worker cross nodes.
apiVersion: v1
kind: Namespace
metadata:
  name: np-echo
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: np-echo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: httpd
          image: ${PROBE_IMAGE}
          command: [sh, -c, 'mkdir -p /tmp/www && echo ok > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www']
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: np-echo
spec:
  selector: {app: echo}
  ports:
    - port: 8080
---
# An echo server off the control planes, which a pod can reach while the
# control planes are down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-echo
  namespace: np-echo
spec:
  replicas: 1
  selector:
    matchLabels: {app: local-echo}
  template:
    metadata:
      labels: {app: local-echo}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: httpd
          image: ${PROBE_IMAGE}
          command: [sh, -c, 'mkdir -p /tmp/www && echo ok > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www']
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Namespace
metadata:
  name: np-control
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Pods may reach only the pod network and cluster DNS. The pod network is a
# namespaceSelector, which both stacks match against pod IPs; see the policy
# shape check for the production ipBlock form.
apiVersion: v1
kind: Namespace
metadata:
  name: np-policed
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-network-and-dns
  namespace: np-policed
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Pods may also reach one external address, so a blocked connection there is
# a drop and not the policy.
apiVersion: v1
kind: Namespace
metadata:
  name: np-allow
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-network-dns-and-external
  namespace: np-allow
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: ${EXTERNAL_IP}/32
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
