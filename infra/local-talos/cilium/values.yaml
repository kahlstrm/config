# Cilium on Talos, replacing Flannel, kube-network-policies and kube-proxy.
# Rendered into ../manifests/cilium.yaml; see ../README.md#cilium.
ipam:
  mode: kubernetes
kubeProxyReplacement: true
# KubePrism, Talos's API load balancer on every node.
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    # Talos forbids SYS_MODULE.
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
# Talos mounts the cgroup2 hierarchy itself.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# Restart pods when their configuration changes, instead of leaving them on the old one.
rollOutCiliumPods: true
# The operator garbage-collects stale CiliumEndpoints, so it must survive the
# cutover's load: requests give it CPU time on a busy node (no CPU limit to
# throttle it), it prefers the workers over the Pi control planes and falls
# back to them (the chart tolerates control-plane taints), and its two
# replicas stay on different nodes. post-render.yq relaxes its liveness probe.
operator:
  rollOutPods: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              io.cilium/app: operator
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
hubble:
  relay:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  tls:
    auto:
      # Keeps generated keys out of the rendered manifest and the machine config.
      method: cronJob
  # Served on each node's port 9965. There is no ServiceMonitor: its CRD
  # comes later, from Flux.
  metrics:
    enabled:
      - drop:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace
