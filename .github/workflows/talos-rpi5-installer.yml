name: Talos Raspberry Pi 5 installer

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace an existing installer tag for the pinned Talos version
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - infra/local-talos/rpi5-installer/**
      - infra/local-talos/versions.json
      - infra/flake.nix
      - infra/flake.lock
      - .github/workflows/talos-rpi5-installer.yml
  pull_request:
    paths:
      - infra/local-talos/rpi5-installer/**
      - infra/local-talos/versions.json
      - infra/flake.nix
      - infra/flake.lock
      - .github/workflows/talos-rpi5-installer.yml

permissions:
  contents: read

concurrency:
  group: talos-rpi5-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Build installer image
        run: |
          nix shell --inputs-from . nixpkgs#crane nixpkgs#jq --command \
            local-talos/rpi5-installer/build.sh "$RUNNER_TEMP/installer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-arm64
          path: ${{ runner.temp }}/installer/installer-arm64.tar
          retention-days: 1
          if-no-files-found: error

  push:
    name: Publish installer
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-arm64
          path: ${{ runner.temp }}/installer
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install crane
        run: nix profile install --inputs-from ./infra nixpkgs#crane
      - name: Push installer tagged with the Talos version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERWRITE: ${{ inputs.overwrite || false }}
        run: |
          # The Talos provider compares this tag with the node's running version, so the tag is
          # exactly the Talos version and is only replaced on explicit request.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/talos-installer-rpi5:$(jq -er .talos infra/local-talos/versions.json)"
          echo "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [ "$OVERWRITE" != true ] && crane digest "$image" >/dev/null 2>&1; then
            echo "$image already exists; dispatch with overwrite to replace it"
            exit 0
          fi
          crane push "$RUNNER_TEMP/installer/installer-arm64.tar" "$image"
