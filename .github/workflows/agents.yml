name: Agent environment
on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - config/AGENTS.md
      - config/agents/skills/**
      - modules/agents/**
      - modules/agent-*/**
      - machines/pannu.nix
      - machines/hardware/pannu.nix
      - machines/agents.nix
      - secrets/secrets.nix
      - secrets/agent-*
      - tests/agent-*.nix
      - tests/agent-*.sh
      - infra/local-kubernetes/apps/agent-debug.yaml
      - infra/local-kubernetes/manifests/agent-debug/**
      - .github/workflows/agents.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - config/AGENTS.md
      - config/agents/skills/**
      - modules/agents/**
      - modules/agent-*/**
      - machines/pannu.nix
      - machines/hardware/pannu.nix
      - machines/agents.nix
      - secrets/secrets.nix
      - secrets/agent-*
      - tests/agent-*.nix
      - tests/agent-*.sh
      - infra/local-kubernetes/apps/agent-debug.yaml
      - infra/local-kubernetes/manifests/agent-debug/**
      - .github/workflows/agents.yml
permissions:
  contents: read
concurrency:
  group: agents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          save: true
          primary-key: nix-agents-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'machines/**', 'modules/**', 'lib/**', 'tests/**', 'config/**', 'secrets/**') }}
          restore-prefixes-first-match: nix-agents-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 6442450944
          purge: true
          purge-prefixes: nix-agents-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Check credentials, isolation, guest services, and deployment
        run: nix build .#checks.x86_64-linux.agent-credentials .#checks.x86_64-linux.agent-kubernetes-rbac .#checks.x86_64-linux.agent-network .#checks.x86_64-linux.agent-guest .#checks.x86_64-linux.agent-storage .#checks.x86_64-linux.agent-deploy --no-link -L
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Evaluate host and guest
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/nix-evaluation-cache
        run: |
          nix eval --raw .#nixosConfigurations.pannu.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.agents.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.pannu.config.microvm.vms.agents.evaluatedConfig.config.system.build.toplevel.drvPath
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Check fixed store repair and permissions
        run: nix build .#checks.x86_64-linux.agent-store-repair --no-link -L
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Check persistent store across boot image replacement
        run: nix build .#checks.x86_64-linux.agent-store-seed .#checks.x86_64-linux.agent-store --no-link -L
