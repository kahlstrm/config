name: Agent environment
on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - config/AGENTS.md
      - config/agents/skills/**
      - modules/agents/**
      - modules/agent-*/**
      - machines/pannu.nix
      - machines/agents.nix
      - tests/agent-*.nix
      - .github/workflows/agents.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - config/AGENTS.md
      - config/agents/skills/**
      - modules/agents/**
      - modules/agent-*/**
      - machines/pannu.nix
      - machines/agents.nix
      - tests/agent-*.nix
      - .github/workflows/agents.yml
permissions:
  contents: read
concurrency:
  group: agents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - parallel:
          - name: Check credentials, isolation, guest services, and deployment
            run: nix build .#checks.x86_64-linux.agent-credentials .#checks.x86_64-linux.agent-network .#checks.x86_64-linux.agent-guest .#checks.x86_64-linux.agent-deploy --no-link -L
          - name: Evaluate host and guest
            env:
              XDG_CACHE_HOME: ${{ runner.temp }}/nix-evaluation-cache
            run: |
              nix eval --raw .#nixosConfigurations.pannu.config.system.build.toplevel.drvPath
              nix eval --raw .#nixosConfigurations.agents.config.system.build.toplevel.drvPath
              nix eval --raw .#nixosConfigurations.pannu.config.microvm.vms.agents.evaluatedConfig.config.system.build.toplevel.drvPath
