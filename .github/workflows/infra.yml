name: Infrastructure checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - .sops.yaml
      - lib/ssh-keys.nix
      - lib/sops-config.nix
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - .sops.yaml
      - lib/ssh-keys.nix
      - lib/sops-config.nix

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting and layer discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.layers.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Discover layers and module test suites
        id: layers
        run: |
          shopt -s globstar nullglob
          directories=()
          for file in infra/*/*.tf; do
            directories+=("${file%/*}")
          done
          for suite in infra/**/tests/*.tftest.hcl; do
            directories+=("${suite%/tests/*}")
          done
          matrix=$(printf '%s\n' "${directories[@]}" | jq -Rsc \
            '{directory: (split("\n") | map(select(length > 0)) | unique)}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.directory }}
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.format.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Run Terraform tests
        run: terraform test -no-color

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Check .sops.yaml matches lib/ssh-keys.nix
        run: nix eval --json --file ../lib/sops-config.nix | jq . | diff - ../.sops.yaml
      - name: Render and validate kustomizations
        run: nix develop .#kubernetes --command local-kubernetes/scripts/validate.sh
      - name: Test alert rules
        run: nix develop .#kubernetes --command local-kubernetes/scripts/test-alerts.sh

  nixos-tests:
    name: NixOS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run Pocket ID sync test
        run: nix build .#checks.x86_64-linux.pocket-id-sync --no-link -L
