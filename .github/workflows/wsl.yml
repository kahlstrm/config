name: Build WSL tarball
on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - Makefile
      - machines/**
      - modules/**
      - lib/**
      - overlays/**
      - pkgs/**
      - config/**
      - secrets/**
      - .github/workflows/wsl.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: wsl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-flake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - run: nix flake check -L
  build-wsl-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: nixbuild/nix-quick-install-action@v30
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # restore and save a cache using this key
          primary-key: nix-wsl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'machines/**', 'modules/**', 'lib/**', 'overlays/**', 'pkgs/**', 'config/**', 'secrets/**') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-wsl-${{ runner.os }}-${{ runner.arch }}-
          # collect garbage until Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          gc-max-store-size-linux: 1073741824
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-wsl-${{ runner.os }}-${{ runner.arch }}-
          # created more than this number of seconds ago relative to the start of the `Post Restore` phase
          purge-created: 0
          # except the version with the `primary-key`, if it exists
          purge-primary-key: never
      - run: make wsl
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl-tarball
          path: nixos.wsl
          # The WSL builder already compresses the tarball with pigz.
          compression-level: 0
          if-no-files-found: error
  test-wsl-artifact:
    runs-on: windows-latest
    needs: [check-flake, build-wsl-artifact]
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: wsl-tarball
          path: wsl-tarball
      - name: Display structure of downloaded files
        run: ls -R
      - name: Import nixos to WSL
        run: |
          wsl --import nixos C:/WSL wsl-tarball/nixos.wsl --version 2
      - name: Test nixos WSL
        run: |
          wsl -d nixos -- cat /etc/os-release
