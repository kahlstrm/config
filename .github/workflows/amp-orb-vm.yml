name: Amp orb VM image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/images/amp-orb-vm/**
      - .github/workflows/amp-orb-vm.yml
  pull_request:
    paths:
      - infra/images/amp-orb-vm/**
      - .github/workflows/amp-orb-vm.yml

permissions:
  contents: read

concurrency:
  group: amp-orb-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and boot the image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Allow the runner user to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the image
        run: |
          nix shell --inputs-from . nixpkgs#qemu-utils nixpkgs#e2fsprogs --command \
            images/amp-orb-vm/build.sh "$RUNNER_TEMP/orb-vm"
      - name: Boot it and start Amp's bootstrap
        run: |
          nix shell --inputs-from . nixpkgs#qemu nixpkgs#xorriso nixpkgs#python3 --command \
            images/amp-orb-vm/smoke-test.sh "$RUNNER_TEMP/orb-vm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orb-vm
          path: ${{ runner.temp }}/orb-vm
          retention-days: 1
          if-no-files-found: error

  push:
    name: Publish the containerDisk
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orb-vm
          path: ${{ runner.temp }}/orb-vm
      - name: Push the containerDisk tagged with the image sources' tree hash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The tag follows the sources, so the dispatch program can pin it before or after a rebuild.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/amp-orb-vm:$(git rev-parse HEAD:infra/images/amp-orb-vm)"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" "$RUNNER_TEMP/orb-vm"
          docker push "$image"
