name: Talos lab tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: >-
          CNI migration scenario to run instead of the pull request jobs. They
          take longer than a pull request job may.
        type: choice
        default: none
        options:
          - none
          - all
          - cilium-migration
          - cilium-helm-handover
          - cilium-upgrade
          - cilium-l2
          - cilium-rollback
          - cilium-failures
          - cilium-terraform
          - netpol-frr
  push:
    branches: [main]
    paths:
      - infra/experiments/talos/**
      - infra/local-talos/versions.json
      - infra/local-talos/main.tf
      - infra/local-talos/patches/**
      - infra/local-talos/cilium/**
      - infra/local-talos/manifests/cilium.yaml
      - infra/modules/talos-cluster/**
      - infra/local-kubernetes/platform/netpol-canary/**
      - infra/flake.nix
      - infra/flake.lock
      - infra/justfile
      - .github/workflows/talos-lab.yml
  pull_request:
    # labeled: a talos-lab:<scenario> label adds that migration scenario.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - infra/experiments/talos/**
      - infra/local-talos/versions.json
      - infra/local-talos/main.tf
      - infra/local-talos/patches/**
      - infra/local-talos/cilium/**
      - infra/local-talos/manifests/cilium.yaml
      - infra/modules/talos-cluster/**
      - infra/local-kubernetes/platform/netpol-canary/**
      - infra/flake.nix
      - infra/flake.lock
      - infra/justfile
      - .github/workflows/talos-lab.yml

permissions:
  contents: read

concurrency:
  group: talos-lab-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          SCENARIO: ${{ inputs.scenario || 'none' }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          migration='["cilium-migration","cilium-helm-handover","cilium-upgrade","cilium-l2","cilium-rollback","cilium-failures","cilium-terraform","netpol-frr"]'
          case "$SCENARIO" in
            none)
              matrix='[{"name":"Unit tests","scenario":"unit","timeout":20},
                       {"name":"NetworkPolicy baseline","scenario":"netpol-baseline","timeout":20},
                       {"name":"Cilium","scenario":"cilium","timeout":20}]' ;;
            all) matrix=$(jq -c 'map({name: ., scenario: ., timeout: 120})' <<<"$migration") ;;
            *) matrix=$(jq -nc --arg s "$SCENARIO" '[{name: $s, scenario: $s, timeout: 120}]') ;;
          esac
          # Pull requests labelled talos-lab:<scenario> or talos-lab:all also
          # run those migration scenarios.
          labelled=$(jq -c --argjson known "$migration" '
            (. // []) as $labels
            | [$labels[] | select(startswith("talos-lab:")) | ltrimstr("talos-lab:")] as $wanted
            | if ($wanted | index("all")) then $known else [$known[] | select(. as $s | $wanted | index($s))] end
            | map({name: ., scenario: ., timeout: 120})' <<<"${LABELS:-[]}")
          matrix=$(jq -c --argjson extra "$labelled" '. + $extra | unique_by(.scenario)' <<<"$matrix")
          echo "matrix=$(jq -c '{include: .}' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SCENARIO: ${{ matrix.scenario }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable KVM access
        if: matrix.scenario != 'unit'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          save: >-
            ${{ github.event_name == 'push' &&
                github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          primary-key: talos-lab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/flake.lock', 'infra/flake.nix', 'infra/experiments/talos/assets.nix', 'infra/local-talos/versions.json', 'infra/local-talos/cilium/chart.json') }}
          restore-prefixes-first-match: talos-lab-${{ runner.os }}-${{ runner.arch }}-
      - name: Test lab helper
        if: matrix.scenario == 'unit'
        run: |
          nix develop .#talos --command go -C experiments/talos vet ./...
          nix develop .#talos --command go -C experiments/talos vet -tags=integration ./...
          nix develop .#talos --command go -C experiments/talos test -count=1 ./...
          test -z "$(nix develop .#talos --command gofmt -l experiments/talos)"
      - name: Run integration scenario
        if: matrix.scenario != 'unit'
        run: |
          nix develop .#talos --command \
            just talos --state "$RUNNER_TEMP/talos-lab" run "$SCENARIO"
      - name: Retain diagnostic logs
        if: always() && matrix.scenario != 'unit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: talos-lab-${{ matrix.scenario }}-logs
          retention-days: 7
          if-no-files-found: ignore
          # Talosconfigs and kubeconfigs hold the disposable cluster's credentials.
          path: |
            ${{ runner.temp }}/talos-lab/*/*/results.txt
            ${{ runner.temp }}/talos-lab/*/*/samples.txt
            ${{ runner.temp }}/talos-lab/*/*/upgrade-k8s-*.log
            ${{ runner.temp }}/talos-lab/*/*/create.log
            ${{ runner.temp }}/talos-lab/*/*/terraform/apply-*.log
            ${{ runner.temp }}/talos-lab/*/*/logs/*.log
