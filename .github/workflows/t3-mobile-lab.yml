name: T3 mobile lab
on:
  # Only the lab's own files trigger it, so infra/flake.lock does not. Run it by hand after an
  # input update.
  workflow_dispatch:
  pull_request:
    paths:
      - infra/experiments/t3-mobile/**
      - .github/workflows/t3-mobile-lab.yml
  push:
    branches: [main]
    paths:
      - infra/experiments/t3-mobile/**
      - .github/workflows/t3-mobile-lab.yml
permissions:
  contents: read
concurrency:
  group: t3-mobile-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Test T3 mobile lab helper
        run: nix build .#checks.x86_64-linux.t3-mobile-lab --no-link -L
