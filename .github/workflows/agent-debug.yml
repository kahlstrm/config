name: Agent debugging RBAC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/local-talos/**
      - infra/flake.nix
      - infra/flake.lock
      - infra/shell.nix
      - .github/workflows/agent-debug.yml
  pull_request:
    paths:
      - infra/local-talos/**
      - infra/flake.nix
      - infra/flake.lock
      - infra/shell.nix
      - .github/workflows/agent-debug.yml

permissions:
  contents: read

jobs:
  rbac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Validate and test debugging permissions
        run: |
          nix develop --command tofu fmt -check local-talos/agent-debug.tf
          nix develop --command tofu -chdir=local-talos/modules/agent-debug fmt -check -recursive
          nix develop --command tofu -chdir=local-talos/modules/agent-debug init -backend=false -lockfile=readonly
          nix develop --command tofu -chdir=local-talos/modules/agent-debug validate
          nix develop --command tofu -chdir=local-talos/modules/agent-debug test
